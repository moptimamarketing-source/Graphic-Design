<!doctype html>
<!--
  Light-sweep transition overlay (0.8 s, 1080×1920, on pure black).

  Rendered on its own and laid over each scene cut in the Remotion film
  with mix-blend-mode: screen, so the black drops out and only light adds.
  Peak brightness lands at 0.4 s, the middle of the film's 16-frame cut.

  Render: npx hyperframes render . -c compositions/flare-sweep.html -o renders/flare-sweep.mp4
-->
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Light Sweep Overlay</title>
    <script src="../assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      #band-wrap {
        position: absolute;
        left: -900px;
        top: -400px;
        width: 2880px;
        height: 2720px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #band {
        width: 520px;
        height: 4200px;
        background: linear-gradient(
          90deg,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 120, 200, 0.35) 22%,
          rgba(127, 211, 247, 0.85) 40%,
          #ffffff 50%,
          rgba(255, 220, 140, 0.8) 60%,
          rgba(228, 24, 36, 0.25) 80%,
          rgba(0, 0, 0, 0) 100%
        );
        filter: blur(18px);
      }
      #streak {
        position: absolute;
        left: -200px;
        top: 955px;
        width: 1480px;
        height: 10px;
        border-radius: 5px;
        background: linear-gradient(90deg, rgba(60, 90, 255, 0), #7fd3f7 30%, #ffffff 50%, #7fd3f7 70%, rgba(60, 90, 255, 0));
        box-shadow: 0 0 30px #7fd3f7;
      }
      #core {
        position: absolute;
        left: 340px;
        top: 760px;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffffff 0%, rgba(127, 211, 247, 0.7) 25%, rgba(0, 0, 0, 0) 70%);
      }
      .spark {
        position: absolute;
        width: 70px;
        height: 70px;
        background: radial-gradient(circle, #ffffff 0%, rgba(255, 255, 255, 0.9) 10%, rgba(0, 0, 0, 0) 60%);
        clip-path: polygon(50% 0%, 56% 44%, 100% 50%, 56% 56%, 50% 100%, 44% 56%, 0% 50%, 44% 44%);
      }
      #spark-1 {
        left: 260px;
        top: 520px;
      }
      #spark-2 {
        left: 700px;
        top: 1300px;
      }
      #spark-3 {
        left: 520px;
        top: 900px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="flare-sweep" data-start="0" data-duration="0.8" data-width="1080" data-height="1920">
      <section id="sweep" class="clip" data-start="0" data-duration="0.8" data-track-index="0">
        <div id="band-wrap"><div id="band"></div></div>
        <div id="streak"></div>
        <div id="core"></div>
        <div id="spark-1" class="spark"></div>
        <div id="spark-2" class="spark"></div>
        <div id="spark-3" class="spark"></div>
      </section>
    </div>
    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        tl.set(".spark", { scale: 0 }, 0);
        // The band crosses diagonally; it is brightest as it passes centre.
        tl.fromTo("#band", { x: -1500, rotation: 22, opacity: 0.2 }, { x: 1500, rotation: 22, opacity: 1, duration: 0.8, ease: "power2.inOut" }, 0);
        tl.fromTo("#band-wrap", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
        tl.to("#band-wrap", { opacity: 0, duration: 0.3, ease: "power2.in" }, 0.5);
        // Anamorphic streak and core flash peak at the cut.
        tl.fromTo("#streak", { scaleX: 0.1, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.32, ease: "expo.out" }, 0.12);
        tl.to("#streak", { scaleX: 1.3, opacity: 0, duration: 0.34, ease: "power2.in" }, 0.44);
        tl.fromTo("#core", { scale: 0.3, opacity: 0 }, { scale: 1.2, opacity: 0.9, duration: 0.28, ease: "power3.out" }, 0.14);
        tl.to("#core", { scale: 1.6, opacity: 0, duration: 0.36, ease: "power2.in" }, 0.42);
        [
          ["#spark-1", 0.18],
          ["#spark-3", 0.3],
          ["#spark-2", 0.4],
        ].forEach(function (s) {
          tl.fromTo(s[0], { scale: 0, rotation: -30, opacity: 1 }, { scale: 1.3, rotation: 30, opacity: 1, duration: 0.18, ease: "power3.out" }, s[1]);
          tl.to(s[0], { scale: 0, rotation: 70, duration: 0.2, ease: "power2.in" }, s[1] + 0.18);
        });
        window.__timelines["flare-sweep"] = tl;
      })();
    </script>
  </body>
</html>
